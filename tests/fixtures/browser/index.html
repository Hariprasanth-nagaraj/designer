<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic booking — distribution test fixture</title><link rel="stylesheet" href="/tokens.css">
<style>body{margin:0;padding:var(--space-group);background:var(--surface);color:var(--ink);font-family:Arial,sans-serif;font-size:var(--text-body);line-height:1.5}main{max-width:960px;margin:auto}h1{font-size:var(--text-heading)}form{display:flex;flex-wrap:wrap;gap:var(--space-group);align-items:end}label{display:grid;gap:var(--space-field)}input,select,button{box-sizing:border-box;min-height:44px;border:1px solid var(--border);border-radius:var(--radius-control);padding:var(--space-field);font:inherit;background:var(--surface);color:var(--ink)}button{padding-inline:var(--space-group);cursor:pointer}button.primary{background:var(--accent);color:var(--surface)}:focus-visible{outline:2px solid var(--focus);outline-offset:2px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:var(--space-field);border-bottom:1px solid var(--border)}section{margin-block:var(--space-section)}#error{color:var(--ink);font-weight:bold}#review{border-left:3px solid var(--accent);padding:var(--space-group)}[hidden]{display:none}</style></head>
<body><main><h1>Clinic appointments</h1><p>Distribution smoke fixture. Local demo only; no patient data is sent.</p>
<form id="booking" novalidate><label>Patient name<input id="patient" autocomplete="off" required></label><label>Appointment time<select id="slot"><option>09:00</option><option>09:30</option><option>10:00</option></select></label><button class="primary">Review booking</button></form>
<p id="error" role="alert"></p><section id="review" hidden aria-label="Review appointment"><h2>Review appointment</h2><p id="summary"></p><button id="confirm" class="primary">Confirm booking</button> <button id="cancel">Keep editing</button></section>
<p id="status" role="status">No appointments booked.</p><section aria-labelledby="scheduleHeading"><h2 id="scheduleHeading">Today's schedule</h2><table><thead><tr><th scope="col">Time</th><th scope="col">Patient</th></tr></thead><tbody id="appointments"></tbody></table></section></main>
<script>const $=id=>document.getElementById(id), booked=new Set();let pending=null;
$('booking').addEventListener('submit',e=>{e.preventDefault();const patient=$('patient').value.trim(),slot=$('slot').value;$('error').textContent='';$('review').hidden=true;
if(!patient){$('error').textContent='Enter the patient name.';$('patient').focus();return}if(booked.has(slot)){$('error').textContent='That time is already booked. Choose another time.';return}
pending={patient,slot};$('summary').textContent=patient+' at '+slot;$('review').hidden=false;$('confirm').focus()});
$('cancel').addEventListener('click',()=>{$('review').hidden=true;pending=null;$('patient').focus()});
$('confirm').addEventListener('click',()=>{if(!pending)return;const{patient,slot}=pending;booked.add(slot);const row=document.createElement('tr');for(const text of[slot,patient]){const cell=document.createElement('td');cell.textContent=text;row.append(cell)}$('appointments').append(row);$('review').hidden=true;$('status').textContent='Booked '+patient+' at '+slot;pending=null;$('patient').value='';$('patient').focus()});</script></body></html>
